    <title>HCMV</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* Global resets to match original body styles strictly */
      body {
        background: black;
        margin: 0;
        padding: 0;
        overflow: hidden;
        touch-action: none;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      .download-button {
        position: fixed;
        top: 12px;
        right: 12px;
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 56px;
        height: 56px;
        padding: 0;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: #aaa;
        cursor: pointer;
        opacity: 0;
        transition: opacity 180ms ease, color 180ms ease;
      }
      .download-button:hover,
      .download-button:focus-visible {
        opacity: 1;
        color: #fff;
      }
      .download-button:focus-visible {
        outline: 1px solid #777;
        outline-offset: -4px;
      }
      @media (hover: none) {
        .download-button { opacity: 0.45; }
      }
    </style>
